name: Build and Release documents

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write 

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PDFs
        run: |
          mkdir -p output
          cat README.md > output/file1.txt
          cat README.md > output/file2.txt

      - name: Upload PDFs as Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: output/*.txt
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
